[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-csv-excel-automation"
version = "0.1.0"
description = "A professional CSV and Excel data automation tool"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<4.0",
    "openpyxl>=3.1,<4.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0"
]

[project.scripts]
data-automation = "data_automation.main:main"

[tool.setuptools.packages.find]
where = ["src"]